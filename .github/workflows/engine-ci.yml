# Full engine suite with Postgres 16 — honest CI (no xfail whitelist).
# Baseline on main (Claude, 2026-09-23): 13 known paper/api failures + 1 Binance skip.
# CI is expected red until a T0-CI follow-up rewrites those tests; any *new*
# failure beyond that baseline is a regression.

name: Engine CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: engine-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest-postgres:
    name: pytest (Postgres 16)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: ichivol_engine_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ichivol_engine_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: ichivol-app/engine

    env:
      # Matches app/config.py default + engine/.env.example
      DATABASE_URL: postgresql+psycopg://postgres:root@127.0.0.1:5432/ichivol_engine_dev
      ENGINE_API_PREFIX: /api/engine
      LOG_LEVEL: info
      # Keep background collectors off during the suite (same idea as local .env)
      ENABLE_BACKTEST_EVIDENCE: "false"
      ENABLE_SIGNAL_TRACKING: "false"
      ENABLE_PROTECTION_MONITOR: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ichivol-app/engine/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply alembic migrations
        run: python -m alembic upgrade head

      - name: Run full pytest suite
        run: python -m pytest tests -v --tb=short

  frontend-build:
    name: frontend (npm build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ichivol-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ichivol-app/package-lock.json
      - run: npm ci
      - run: npm run build
