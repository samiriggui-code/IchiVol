# IchiVol — production stack (Hostinger VPS + Traefik)
# Deploy: clone repo to /opt/ichivol then:
#   docker compose --env-file deploy/vps/.env up -d --build
# FQDN: https://ichivol.global-it-ss.com
# Smoke: http://187.77.166.124:3060
name: ichivol

services:
  postgres:
    image: postgres:16-alpine
    container_name: ichivol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ichivol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ichivol}
    volumes:
      - ichivol_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - ichivol

  postgres-init:
    image: postgres:16-alpine
    container_name: ichivol-postgres-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-ichivol}
    entrypoint:
      - /bin/sh
      - -c
      - |
        psql -h postgres -U "$$POSTGRES_USER" -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='ichivol_engine'" | grep -q 1 \
          || psql -h postgres -U "$$POSTGRES_USER" -d postgres -c "CREATE DATABASE ichivol_engine;"
    restart: 'no'
    networks:
      - ichivol

  engine:
    build:
      context: ./ichivol-app/engine
      dockerfile: Dockerfile
    image: ichivol-engine:latest
    container_name: ichivol-engine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ichivol}:${POSTGRES_PASSWORD}@postgres:5432/ichivol_engine
      ENGINE_API_PREFIX: /api/engine
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
      ENABLE_BACKTEST_EVIDENCE: ${ENABLE_BACKTEST_EVIDENCE:-true}
      BACKTEST_EVIDENCE_INTERVAL_S: ${BACKTEST_EVIDENCE_INTERVAL_S:-86400}
      OB_DATA_DIR: /data/orderbook
    volumes:
      # OB-1: files written by orderbook-collector, read-only for the engine (API /orderbook, FactSheet ob.*)
      - ichivol_orderbook:/data/orderbook:ro
    networks:
      - ichivol

  # OB-1 — collecte du carnet d'ordres + aggTrades Binance spot (docs/ETUDE-ORDERFLOW-MTF-2026-10-02.md §3.3).
  # Service séparé : son arrêt ou son plantage n'affecte ni l'engine ni le paper. Même image que l'engine,
  # sans migrations (entrypoint remplacé). Observe-only : aucune donnée n'entre dans les décisions.
  orderbook-collector:
    image: ichivol-engine:latest
    container_name: ichivol-orderbook-collector
    restart: unless-stopped
    depends_on:
      - engine
    entrypoint: ['python', '-m', 'app.microstructure.book.collector']
    environment:
      OB_SYMBOLS: ${OB_SYMBOLS:-BTCUSDT}
      OB_DATA_DIR: /data/orderbook
      OB_RAW: ${OB_RAW:-1}
      OB_RAW_RETENTION_DAYS: ${OB_RAW_RETENTION_DAYS:-7}
      OB_AGG_RETENTION_DAYS: ${OB_AGG_RETENTION_DAYS:-365}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ichivol_orderbook:/data/orderbook
    networks:
      - ichivol

  server:
    build:
      context: ./ichivol-app/server
      dockerfile: Dockerfile
    image: ichivol-server:latest
    container_name: ichivol-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      engine:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: '8787'
      DATABASE_URL: postgresql://${POSTGRES_USER:-ichivol}:${POSTGRES_PASSWORD}@postgres:5432/ichivol?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      SETTINGS_SECRET: ${SETTINGS_SECRET:-}
      ENGINE_URL: http://engine:8000
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      LLM_MODEL: ${LLM_MODEL:-anthropic/claude-sonnet-4.5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AGENT_FACTSHEET_V1: ${AGENT_FACTSHEET_V1:-0}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
    networks:
      - ichivol

  web:
    build:
      context: ./ichivol-app
      dockerfile: Dockerfile
    image: ichivol-web:latest
    container_name: ichivol-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '3060:80'
    networks:
      - ichivol
    labels:
      - traefik.enable=true
      - traefik.http.routers.ichivol.entrypoints=websecure
      - traefik.http.routers.ichivol.rule=Host(`ichivol.global-it-ss.com`)
      - traefik.http.routers.ichivol.tls.certresolver=letsencrypt
      - traefik.http.services.ichivol.loadbalancer.server.port=80

volumes:
  ichivol_pg:
  ichivol_orderbook:

networks:
  ichivol:
    name: ichivol
