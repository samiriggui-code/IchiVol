# IchiVol — production stack (Hostinger VPS + Traefik)
# Deploy: clone repo to /opt/ichivol then:
#   docker compose --env-file deploy/vps/.env up -d --build
# FQDN: https://ichivol.global-it-ss.com
# Smoke: http://187.77.166.124:3060
name: ichivol

services:
  postgres:
    image: postgres:16-alpine
    container_name: ichivol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ichivol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ichivol}
    volumes:
      - ichivol_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - ichivol

  postgres-init:
    image: postgres:16-alpine
    container_name: ichivol-postgres-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-ichivol}
    entrypoint:
      - /bin/sh
      - -c
      - |
        psql -h postgres -U "$$POSTGRES_USER" -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='ichivol_engine'" | grep -q 1 \
          || psql -h postgres -U "$$POSTGRES_USER" -d postgres -c "CREATE DATABASE ichivol_engine;"
    restart: 'no'
    networks:
      - ichivol

  engine:
    build:
      context: ./ichivol-app/engine
      dockerfile: Dockerfile
    image: ichivol-engine:latest
    container_name: ichivol-engine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ichivol}:${POSTGRES_PASSWORD}@postgres:5432/ichivol_engine
      ENGINE_API_PREFIX: /api/engine
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
      ENABLE_BACKTEST_EVIDENCE: ${ENABLE_BACKTEST_EVIDENCE:-true}
      BACKTEST_EVIDENCE_INTERVAL_S: ${BACKTEST_EVIDENCE_INTERVAL_S:-86400}
      # MT5 stays unregistered (provider not wired) unless MT5_ENABLED=true
      # AND the mt5-bridge profile is actually running -- see mt5-bridge/README.md.
      MT5_ENABLED: ${MT5_ENABLED:-false}
      MT5_MODE: ${MT5_MODE:-READ_ONLY}
      MT5_BRIDGE_URL: ${MT5_BRIDGE_URL:-http://mt5-bridge:8000}
    networks:
      - ichivol
      - mt5_bridge

  server:
    build:
      context: ./ichivol-app/server
      dockerfile: Dockerfile
    image: ichivol-server:latest
    container_name: ichivol-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      engine:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: '8787'
      DATABASE_URL: postgresql://${POSTGRES_USER:-ichivol}:${POSTGRES_PASSWORD}@postgres:5432/ichivol?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      SETTINGS_SECRET: ${SETTINGS_SECRET:-}
      ENGINE_URL: http://engine:8000
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      LLM_MODEL: ${LLM_MODEL:-anthropic/claude-sonnet-4.5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
    networks:
      - ichivol

  web:
    build:
      context: ./ichivol-app
      dockerfile: Dockerfile
    image: ichivol-web:latest
    container_name: ichivol-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '3060:80'
    networks:
      - ichivol
    labels:
      - traefik.enable=true
      - traefik.http.routers.ichivol.entrypoints=websecure
      - traefik.http.routers.ichivol.rule=Host(`ichivol.global-it-ss.com`)
      - traefik.http.routers.ichivol.tls.certresolver=letsencrypt
      - traefik.http.services.ichivol.loadbalancer.server.port=80

  # MT5 bridge (Phase 2, READ ONLY) -- Wine + MetaTrader5 terminal + a thin
  # FastAPI wrapper (ichivol-app/mt5-bridge/README.md). NOT started by
  # `docker compose up -d` on its own: requires `--profile mt5` explicitly,
  # so a normal deploy of this stack never touches it. Hard resource caps
  # below are non-negotiable -- this VPS also runs other clients' services
  # (gsms-crm, pizzeria, qatrial, grace, ...); a Wine/GUI process misbehaving
  # must never be able to starve them.
  mt5-bridge:
    profiles: ['mt5']
    build:
      context: ./ichivol-app/mt5-bridge
      dockerfile: Dockerfile
    image: ichivol-mt5-bridge:latest
    container_name: ichivol-mt5-bridge
    restart: unless-stopped
    mem_limit: 3g
    memswap_limit: 3g
    cpus: 1.5
    environment:
      MT5_LOGIN: ${MT5_LOGIN:?set MT5_LOGIN in deploy/vps/.env, never in git}
      MT5_PASSWORD: ${MT5_PASSWORD:?set MT5_PASSWORD in deploy/vps/.env, never in git}
      MT5_SERVER: ${MT5_SERVER:?set MT5_SERVER (broker server name) in deploy/vps/.env}
    volumes:
      - ichivol_mt5_wine:/root/.wine
    networks:
      - mt5_bridge
    # No `ports:` on purpose -- not reachable from outside the mt5_bridge
    # network. VNC (for first login / 2FA / manual reconfig) is exposed via
    # SSH tunnel only, see mt5-bridge/README.md -- never a public port on
    # this shared VPS.

volumes:
  ichivol_pg:
  ichivol_mt5_wine:

networks:
  ichivol:
    name: ichivol
  # Isolated on purpose: only `engine` and `mt5-bridge` sit on this network.
  # Never shared with `ichivol` clients' other containers or with any other
  # project's network on this VPS (gsms-crm, pizzeria, qatrial, grace, ...).
  mt5_bridge:
    name: ichivol_mt5_bridge
