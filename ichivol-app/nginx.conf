server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://server:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location /binance/ {
    proxy_pass https://data-api.binance.vision/;
    proxy_ssl_server_name on;
    proxy_set_header Host data-api.binance.vision;
    proxy_set_header Accept application/json;
    proxy_set_header User-Agent "IchiVol/1.0";
  }

  location /bybit/ {
    proxy_pass https://api.bybit.com/;
    proxy_ssl_server_name on;
    proxy_set_header Host api.bybit.com;
    proxy_set_header Accept application/json;
    proxy_set_header User-Agent "IchiVol/1.0";
  }

  location /okx/ {
    proxy_pass https://www.okx.com/;
    proxy_ssl_server_name on;
    proxy_set_header Host www.okx.com;
    proxy_set_header Accept application/json;
    proxy_set_header User-Agent "IchiVol/1.0";
  }

  location /coingecko/ {
    proxy_pass https://api.coingecko.com/;
    proxy_ssl_server_name on;
    proxy_set_header Host api.coingecko.com;
    proxy_set_header Accept application/json;
    proxy_set_header User-Agent "IchiVol/1.0";
  }

  location /feargreed/ {
    proxy_pass https://api.alternative.me/;
    proxy_ssl_server_name on;
    proxy_set_header Host api.alternative.me;
    proxy_set_header Accept application/json;
    proxy_set_header User-Agent "IchiVol/1.0";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
